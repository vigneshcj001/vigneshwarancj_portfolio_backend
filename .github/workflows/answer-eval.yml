name: Answer quality (live model)

# Real Groq calls: uses credits. Runs weekly and on demand, never per commit.
# Needs repository secrets GROQ_API_KEY (required) and LAYA_API_KEY (for refusal
# cases to reflect production routing). Without GROQ_API_KEY the job skips.
on:
  workflow_dispatch:
    inputs:
      judge:
        description: "Also score faithfulness with a model judge"
        type: boolean
        default: true
  schedule:
    - cron: "30 3 * * 1"  # Mondays 03:30 UTC

jobs:
  answer-eval:
    runs-on: ubuntu-24.04
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LAYA_API_KEY: ${{ secrets.LAYA_API_KEY }}
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Check for model credentials
        id: creds
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY secret not set; skipping the live answer evaluation."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.creds.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run answer evaluation
        if: steps.creds.outputs.ready == 'true'
        run: python -m evals.answer_eval ${{ (github.event_name == 'schedule' || inputs.judge) && '--judge' || '' }} --report answer-eval-report.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.ready == 'true'
        with:
          name: answer-eval-report
          path: answer-eval-report.json
          if-no-files-found: ignore
